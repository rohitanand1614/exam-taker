[pytest]
testpaths = tests
# tests.plugins.isolation resets Streamlit's process-wide page state between AppTest runs.
# Run with `python -m pytest` (it puts this folder on sys.path so the plugin can be imported;
# the bare `pytest` script does not, and `pythonpath` is applied too late for -p plugins).
addopts = -p tests.plugins.isolation
markers =
    smoke: every page loads without exception
    flow: user-flow behaviour contract (AppTest)
    logic: characterization tests of utils / business rules
    ui: UI expectations added per redesign batch
